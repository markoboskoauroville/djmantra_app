name: Android

# Port milestones M2/M3: cross-compile the Mixxx engine's native dependencies
# for Android, then build Mixxx itself with Qt for Android into an APK.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependencies (${{ matrix.triplet }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triplet: [arm64-android, x64-android]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_COMMIT: 2750401336fb7c95f6619657a46a7e798661341c
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive automake libtool pkg-config nasm

      - name: Select Android NDK r27 (supported by Qt 6.8)
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "Using NDK $NDK"
          echo "DJMANTRA_NDK=$NDK" >> "$GITHUB_ENV"
          echo "DJMANTRA_NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.DJMANTRA_NDK_VERSION }}-${{ hashFiles('packaging/android/vcpkg.json', 'packaging/android/triplets/*') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ env.DJMANTRA_NDK_VERSION }}-${{ hashFiles('packaging/android/vcpkg.json', 'packaging/android/triplets/*') }}-
            vcpkg-${{ matrix.triplet }}-${{ env.DJMANTRA_NDK_VERSION }}-

      - name: Build dependencies
        run: |
          export ANDROID_NDK_HOME="${DJMANTRA_NDK:?}"
          mkdir -p vcpkg-cache
          echo "NDK: $ANDROID_NDK_HOME"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=packaging/android \
            --overlay-triplets=packaging/android/triplets \
            --triplet=${{ matrix.triplet }} \
            --x-install-root=${{ github.workspace }}/android-deps

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: vcpkg/buildtrees/**/*.log

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          # Includes the host (x64-linux) tools vcpkg built, e.g. protoc.
          name: android-deps-${{ matrix.triplet }}
          path: android-deps
          retention-days: 7

  app:
    name: Mixxx for Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    needs: deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: arm64-android
            abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - triplet: x64-android
            abi: x86_64
            qt_arch: android_x86_64
    env:
      QT_VERSION: 6.8.3
      QT_ROOT: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update
          # Runtime libraries for Qt's desktop host tools (qsb, qmlcachegen, rcc, ...).
          sudo apt-get install -y --no-install-recommends ninja-build \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/download-artifact@v4
        with:
          name: android-deps-${{ matrix.triplet }}
          path: android-deps

      - name: Restore executable bits on host tools
        # Artifacts don't keep file permissions (protoc etc. come back non-executable).
        run: find android-deps/x64-linux/tools -type f -exec chmod +x {} +

      - name: Select Android NDK r27 (supported by Qt 6.8)
        run: |
          NDK=$(ls -d "$ANDROID_SDK_ROOT"/ndk/27.* 2>/dev/null | sort -V | tail -1)
          if [ -z "$NDK" ]; then
            yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          fi
          echo "Using NDK $NDK"
          echo "DJMANTRA_NDK=$NDK" >> "$GITHUB_ENV"
          echo "DJMANTRA_NDK_VERSION=$(basename "$NDK")" >> "$GITHUB_ENV"

      - name: Install Qt for Android (and the matching desktop host tools)
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$QT_ROOT" -m qtshadertools qt5compat
          aqt install-qt linux android "$QT_VERSION" ${{ matrix.qt_arch }} -O "$QT_ROOT" -m qtshadertools qt5compat
          ls "$QT_ROOT/$QT_VERSION"

      - name: Configure
        run: |
          export ANDROID_NDK_ROOT="${DJMANTRA_NDK:?}"
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          DEPS="$GITHUB_WORKSPACE/android-deps/${{ matrix.triplet }}"
          HOSTDEPS="$GITHUB_WORKSPACE/android-deps/x64-linux"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT/$QT_VERSION/${{ matrix.qt_arch }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_ROOT/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_FIND_ROOT_PATH="$DEPS" \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DProtobuf_PROTOC_EXECUTABLE="$HOSTDEPS/tools/protobuf/protoc" \
            -DQT6=ON -DQML=ON -DWARNINGS_FATAL=OFF

      - name: Build APK
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          # -k 0: keep going after errors so one run reports all of them.
          cmake --build build-android --target apk -- -k 0 2>&1 | tee build-android.log

      - name: Summarize build errors
        if: failure()
        run: |
          echo "### Distinct compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(error|fatal error):' build-android.log \
            | sed -E 's/^[^ ]+Z //; s#^.*/djmantra_app/##' \
            | sort | uniq -c | sort -rn | head -150 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload configure/build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ matrix.abi }}
          path: |
            build-android/CMakeFiles/CMakeOutput.log
            build-android/CMakeFiles/CMakeError.log
            build-android/CMakeFiles/CMakeConfigureLog.yaml

      - name: Sign APK with the public test key
        run: |
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(find build-android -name '*-unsigned.apk' | head -1)
          [ -n "$UNSIGNED" ] || UNSIGNED=$(find build-android -name '*.apk' | head -1)
          echo "Signing $UNSIGNED with $(basename "$BT")"
          mkdir -p apk-out
          "$BT/zipalign" -f -p 4 "$UNSIGNED" apk-out/aligned.apk
          "$BT/apksigner" sign \
            --ks packaging/android/djmantra-test.keystore --ks-key-alias djmantra-test \
            --ks-pass pass:android --key-pass pass:android \
            --out "apk-out/djmantra-${{ matrix.abi }}.apk" apk-out/aligned.apk
          rm apk-out/aligned.apk
          "$BT/apksigner" verify --print-certs "apk-out/djmantra-${{ matrix.abi }}.apk" | head -3

      - name: Check native libraries (no "library ... not found" at launch)
        run: |
          set -o pipefail
          # Every NEEDED library must be in the APK or an Android system library.
          # pipefail: a MISSING library fails the job (tee alone would hide it).
          tools/android/check_apk_libs.sh "apk-out/djmantra-${{ matrix.abi }}.apk" \
            "${{ matrix.abi }}" 29 "${DJMANTRA_NDK:?}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check name, icon and resources in the APK
        run: |
          set -o pipefail
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          APK="apk-out/djmantra-${{ matrix.abi }}.apk"
          "$BT/aapt" dump badging "$APK" | grep -E "^(package|application-label|application:)" | tee -a "$GITHUB_STEP_SUMMARY"
          "$BT/aapt" dump badging "$APK" | grep -q "^application-label:'DJ Mantra'" \
            || { echo "FAIL: the launcher label is not DJ Mantra"; exit 1; }
          "$BT/aapt" dump badging "$APK" | grep -q "icon='res/" \
            || { echo "FAIL: no launcher icon"; exit 1; }
          FILES=$(unzip -l "$APK" | grep -c " assets/res/" || true)
          echo "assets/res: $FILES files" | tee -a "$GITHUB_STEP_SUMMARY"
          unzip -l "$APK" | grep -q " assets/res/djmantra-res.stamp" \
            || { echo "FAIL: assets/res (skins, mappings) missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q " assets/res/controllers/Hercules DJControl Mix Ultra.midi.xml" \
            || { echo "FAIL: the Mix Ultra mapping is missing from the APK"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: djmantra-${{ matrix.abi }}-apk
          path: apk-out/djmantra-${{ matrix.abi }}.apk

      - name: Collect the unstripped library (names the functions in a crash)
        run: |
          mkdir -p symbols
          LIB=$(find build-android -maxdepth 2 -name "libmixxx_${{ matrix.abi }}.so" | head -1)
          [ -n "$LIB" ] || { echo "libmixxx_${{ matrix.abi }}.so not found"; exit 1; }
          cp "$LIB" symbols/
          ls -l symbols

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        with:
          name: djmantra-${{ matrix.abi }}-symbols
          path: symbols
          retention-days: 14

  launch:
    # Phone test run #31 crashed 25 s after start; this catches such a crash
    # (and critical-error dialogs) before an APK reaches the phone.
    name: Launch test on the emulator (x86_64)
    runs-on: ubuntu-24.04
    needs: app
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: djmantra-x86_64-apk
          path: apk

      - uses: actions/download-artifact@v4
        with:
          name: djmantra-x86_64-symbols
          path: symbols

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: tools/android/smoke_test.sh apk/djmantra-x86_64.apk launch-out symbols

      - name: Summary
        if: always()
        run: |
          [ -f launch-out/summary.txt ] && cat launch-out/summary.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload launch test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launch-test-x86_64
          path: launch-out


  publish:
    # Every green build of main becomes the download for testers:
    # https://github.com/<owner>/<repo>/releases/tag/android-latest
    name: Publish the tested APKs (main only)
    runs-on: ubuntu-24.04
    needs: [app, launch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: djmantra-arm64-v8a-apk
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: djmantra-x86_64-apk
          path: out
      - name: Replace the android-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=0.5.0
          SHORT=${GITHUB_SHA::7}
          mv out/djmantra-arm64-v8a.apk "out/DJMantra-${VERSION}-${SHORT}-phone-arm64.apk"
          mv out/djmantra-x86_64.apk "out/DJMantra-${VERSION}-${SHORT}-emulator-x86_64.apk"
          ls -l out
          gh release delete android-latest --cleanup-tag --yes || true
          gh release create android-latest out/*.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "DJ Mantra ${VERSION} (test build ${SHORT})" \
            --notes "Newest build of main that passed every check: unit tests, the APK library check, and the launch test on an Android emulator (starts, sound output running, main window ready).

          - Phones (Pixel 7 and other 64-bit ARM phones): **DJMantra-${VERSION}-${SHORT}-phone-arm64.apk**
          - Android emulator: DJMantra-${VERSION}-${SHORT}-emulator-x86_64.apk

          Install: open the file on the phone and allow installing from this source, or \`adb install -r <file>\`. Signed with the public test key, so it updates in place over earlier test builds.

          Commit: ${GITHUB_SHA}"
