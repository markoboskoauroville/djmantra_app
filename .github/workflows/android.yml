name: Android

# Port milestones M2/M3: cross-compile the Mixxx engine's native dependencies
# for Android, then build Mixxx itself with Qt for Android into an APK.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    name: Dependencies (${{ matrix.triplet }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        triplet: [arm64-android, x64-android]
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
      VCPKG_COMMIT: 2750401336fb7c95f6619657a46a7e798661341c
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build autoconf autoconf-archive automake libtool pkg-config nasm

      - name: Set up vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" checkout "$VCPKG_COMMIT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ hashFiles('packaging/android/vcpkg.json', 'packaging/android/triplets/*') }}-${{ github.sha }}
          restore-keys: |
            vcpkg-${{ matrix.triplet }}-${{ hashFiles('packaging/android/vcpkg.json', 'packaging/android/triplets/*') }}-
            vcpkg-${{ matrix.triplet }}-

      - name: Build dependencies
        run: |
          # Runner-provided shell variable; not visible in the workflow env context.
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:?NDK not found on runner}"
          mkdir -p vcpkg-cache
          echo "NDK: $ANDROID_NDK_HOME"
          "$VCPKG_ROOT/vcpkg" install \
            --x-manifest-root=packaging/android \
            --overlay-triplets=packaging/android/triplets \
            --triplet=${{ matrix.triplet }} \
            --x-install-root=${{ github.workspace }}/android-deps

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-logs-${{ matrix.triplet }}
          path: vcpkg/buildtrees/**/*.log

      - name: Upload dependencies
        uses: actions/upload-artifact@v4
        with:
          # Includes the host (x64-linux) tools vcpkg built, e.g. protoc.
          name: android-deps-${{ matrix.triplet }}
          path: android-deps
          retention-days: 7

  app:
    name: Mixxx for Android (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    needs: deps
    strategy:
      fail-fast: false
      matrix:
        include:
          - triplet: arm64-android
            abi: arm64-v8a
            qt_arch: android_arm64_v8a
          - triplet: x64-android
            abi: x86_64
            qt_arch: android_x86_64
    env:
      QT_VERSION: 6.8.3
      QT_ROOT: ${{ github.workspace }}/Qt
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          sudo apt-get update
          # Runtime libraries for Qt's desktop host tools (qsb, qmlcachegen, rcc, ...).
          sudo apt-get install -y --no-install-recommends ninja-build \
            libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: actions/download-artifact@v4
        with:
          name: android-deps-${{ matrix.triplet }}
          path: android-deps

      - name: Restore executable bits on host tools
        # Artifacts don't keep file permissions (protoc etc. come back non-executable).
        run: find android-deps/x64-linux/tools -type f -exec chmod +x {} +

      - name: Install Qt for Android (and the matching desktop host tools)
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$QT_ROOT" -m qtshadertools qt5compat
          aqt install-qt linux android "$QT_VERSION" ${{ matrix.qt_arch }} -O "$QT_ROOT" -m qtshadertools qt5compat
          ls "$QT_ROOT/$QT_VERSION"

      - name: Configure
        run: |
          export ANDROID_NDK_ROOT="${ANDROID_NDK_LATEST_HOME:?}"
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          DEPS="$GITHUB_WORKSPACE/android-deps/${{ matrix.triplet }}"
          HOSTDEPS="$GITHUB_WORKSPACE/android-deps/x64-linux"
          export PKG_CONFIG_LIBDIR="$DEPS/lib/pkgconfig:$DEPS/share/pkgconfig"
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_TOOLCHAIN_FILE="$QT_ROOT/$QT_VERSION/${{ matrix.qt_arch }}/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_ROOT/$QT_VERSION/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" \
            -DANDROID_NDK_ROOT="$ANDROID_NDK_ROOT" \
            -DANDROID_ABI=${{ matrix.abi }} \
            -DANDROID_PLATFORM=android-29 \
            -DCMAKE_FIND_ROOT_PATH="$DEPS" \
            -DCMAKE_PREFIX_PATH="$DEPS" \
            -DProtobuf_PROTOC_EXECUTABLE="$HOSTDEPS/tools/protobuf/protoc" \
            -DQT6=ON -DQML=ON -DWARNINGS_FATAL=OFF

      - name: Build APK
        run: |
          set -o pipefail
          export JAVA_HOME="${JAVA_HOME_17_X64:?}"
          # -k 0: keep going after errors so one run reports all of them.
          cmake --build build-android --target apk -- -k 0 2>&1 | tee build-android.log

      - name: Summarize build errors
        if: failure()
        run: |
          echo "### Distinct compiler errors" >> "$GITHUB_STEP_SUMMARY"
          grep -E '(error|fatal error):' build-android.log \
            | sed -E 's/^[^ ]+Z //; s#^.*/djmantra_app/##' \
            | sort | uniq -c | sort -rn | head -150 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload configure/build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-logs-${{ matrix.abi }}
          path: |
            build-android/CMakeFiles/CMakeOutput.log
            build-android/CMakeFiles/CMakeError.log
            build-android/CMakeFiles/CMakeConfigureLog.yaml

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: djmantra-${{ matrix.abi }}-apk
          path: build-android/**/*.apk
